name: Build & Deploy (Vite → GitHub Pages)

# Manual trigger only for now — this repo's GitHub Pages is currently set to
# "Deploy from a branch" (serving index.html/order.html directly from the
# repo root), which already works with zero build step.
#
# To switch to this Actions-based, minified/hashed build instead:
#   1. Repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#   2. Change the trigger below from workflow_dispatch to:
#        on:
#          push:
#            branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
